<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 90" width="100%" height="100%">
  <style>
    .logo-pt1 {
      font-family: 'Montserrat', sans-serif;
      font-weight: 700;
      font-size: 21px;
      fill: #ffffff;
      letter-spacing: 5.2px;
    }
    .logo-pt2 {
      font-family: 'Montserrat', sans-serif;
      font-weight: 800;
      font-size: 32px;
      fill: #ffffff;
      letter-spacing: 2px;
    }
  </style>
  <!-- Linha 1: ÓPTIC + A (chevron) -->
  <text x="0" y="26" class="logo-pt1">ÓPTIC</text>
  <!-- Letra A estilizada (Chevron / V invertido) -->
  <path d="M 120,26 L 131,7 L 142,26" stroke="#ffffff" stroke-width="4.8" fill="none" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Linha 2: MA + R (estilizado) + IO NETO -->
  <text x="0" y="65" class="logo-pt2">MA</text>
  <!-- Letra R estilizada (Perna descolada do laço) -->
  <!-- Haste vertical -->
  <path d="M 52,41 L 52,65" stroke="#ffffff" stroke-width="6.2" stroke-linecap="round" fill="none" />
  <!-- Laço semicircular -->
  <path d="M 52,41 C 65,41 73,43 73,50 C 73,56 65,58 52,58" stroke="#ffffff" stroke-width="6.2" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  <!-- Perna diagonal descolada -->
  <path d="M 64,52 L 74,65" stroke="#ffffff" stroke-width="6.2" stroke-linecap="round" fill="none" />
  <!-- Resto do texto: IO NETO -->
  <text x="80" y="65" class="logo-pt2">IO NETO</text>
</svg>
